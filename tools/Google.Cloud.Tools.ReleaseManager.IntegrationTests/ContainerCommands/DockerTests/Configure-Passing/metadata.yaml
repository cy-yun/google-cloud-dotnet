command: configure
args:
- '--api-root=/test/api-root'
- '--generator-input=/test/generator-input'
- '--api-path=google/test/v3'
commonFiles:
  - source: test-apis.json
    target: generator-input/apis.json
  - source: test-state.json
    target: generator-input/pipeline-state.json
fileExpectations:
  assertContentEquals:
  - expected: expected/apis.json
    actual: generator-input/apis.json
  - expected: expected/pipeline-state.json
    actual: generator-input/pipeline-state.json